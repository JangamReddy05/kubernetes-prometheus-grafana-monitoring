apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: monitoring-demo-alerts
  namespace: monitoring

  labels:
    release: my-prom-stack

spec:
  groups:
    - name: monitoring-demo.rules

      rules:

        - alert: ApplicationDown
          expr: up{job=~".*monitoring.*"} == 0
          for: 1m

          labels:
            severity: critical

          annotations:
            summary: "Monitoring application is down"
            description: "The monitoring application has been unavailable for more than 1 minute."

        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{
              namespace="monitoring-app",
              container!="POD",
              container!=""
            }[5m])) > 0.8

          for: 2m

          labels:
            severity: warning

          annotations:
            summary: "High CPU usage"
            description: "Application CPU usage is above the configured threshold."

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{
              namespace="monitoring-app",
              container!="POD",
              container!=""
            }) > 500000000

          for: 2m

          labels:
            severity: warning

          annotations:
            summary: "High memory usage"
            description: "Application memory usage is above the configured threshold."